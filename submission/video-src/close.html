<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#08121a;color:#fff;font-family:Geist,sans-serif;display:grid;place-items:center;position:relative}
.mesh i{position:absolute;border-radius:50%;filter:blur(120px)}
.mesh i:nth-child(1){width:60%;height:110%;left:-14%;top:-40%;background:#0e5e63;opacity:.85}
.mesh i:nth-child(2){width:46%;height:90%;right:-10%;bottom:-30%;background:#e2552d;opacity:.55}
.mesh i:nth-child(3){width:22%;height:40%;right:30%;top:-14%;background:#f2a33a;opacity:.32}
.in{position:relative;text-align:center}
svg{height:150px}
svg path,svg circle{opacity:0}
.go svg path{opacity:1;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
.go svg path.q{animation-delay:.35s}
.go svg circle{animation:pop .4s ease 1.2s forwards}
h1{font-family:'Bricolage Grotesque';font-weight:700;font-size:118px;letter-spacing:-.045em;line-height:1;margin-top:34px;opacity:0;transform:translateY(16px)}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffb86b,#ff6a3d 55%,#ff4f7a);-webkit-background-clip:text;color:transparent}
.url{font-family:'Geist Mono';font-size:38px;color:rgba(255,255,255,.8);margin-top:34px;opacity:0}
.by{font-size:24px;color:rgba(255,255,255,.55);margin-top:20px;opacity:0}
.go h1{animation:up .7s ease .9s forwards}.go .url{animation:fade .6s ease 1.5s forwards}.go .by{animation:fade .6s ease 1.9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1}}@keyframes up{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}
</style></head><body>
<div class="mesh"><i></i><i></i><i></i></div>
<div class="in">
  <svg viewBox="0 0 40 48"><path pathLength="1" d="M20 37 C 9 29, 3 22, 3.5 14 C 4 7, 10 4, 14.5 5 C 17.5 5.7, 19.2 7.6, 20 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path class="q" pathLength="1" d="M20 10 C 21.5 5.5, 26 3.6, 30 4.6 C 35 5.8, 37.5 10.5, 36 15.5 C 34.5 20.5, 27 22.5, 23.5 26 C 21.2 28.3, 20.4 31, 20.2 33.5" fill="none" stroke="#ff6a3d" stroke-width="5.5" stroke-linecap="round"/><circle cx="20" cy="43.5" r="3.4" fill="#ff6a3d"/></svg>
  <h1>Your audiences.<br><em>And their ads.</em></h1>
  <div class="url">whowouldlove.javi.link</div>
  <div class="by">Taste data by Qloo · Built for the Qloo Agentic Hackathon</div>
</div>
</body></html>
