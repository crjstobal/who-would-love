<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample reports · Who Would Love</title>
<meta name="description" content="Finished Who Would Love audience reports for real products: who would love each one, what else they love according to Qloo, and where to find them.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#15121b;--ink-2:#4f4a58;--ink-3:#8b8693;--line:#e4e0e8;--soft:#f4f2f6;--accent:#ff6a3d;--accent-2:#e2552d;--qloo:#1f6f5c;--qloo-bg:#e3f1ec}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
a{color:var(--accent-2)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600;font-size:22px;letter-spacing:-.025em;display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.logo svg{width:28px;height:34px}
.top nav{display:flex;gap:20px;font-size:15px}.top nav a{color:var(--ink-2);text-decoration:none}.top nav a:hover{color:var(--ink)}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600;letter-spacing:-.035em;line-height:1.05;font-size:48px;margin:56px 0 12px}
.intro{color:var(--ink-2);max-width:40em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:40px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(21,18,27,.35)}
.head{display:flex;gap:14px;align-items:center}
.icon{width:56px;height:56px;border-radius:14px;flex:none;object-fit:cover;background:var(--soft)}
.mono{display:grid;place-items:center;background:linear-gradient(135deg,#0e5e63,#e2552d);color:#fff;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600;font-size:26px}
.card h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.host{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.summary{color:var(--ink-2);font-size:15.5px;margin-top:16px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.label{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13.5px;background:var(--soft);border-radius:9px;padding:4px 10px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:20px;font-size:14px}
.badge{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:var(--qloo-bg);color:var(--qloo);border-radius:999px;padding:4px 10px}
.foot > div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date{color:var(--ink-3);font-size:13px;white-space:nowrap}
.go{font-weight:600;color:var(--accent-2);white-space:nowrap}
.state{color:var(--ink-3);margin-top:40px}
@media (max-width:600px){.wrap{padding:28px 16px 60px}h1{font-size:36px;margin-top:40px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top">
  <a class="logo" href="/"><svg viewBox="0 0 40 48" aria-hidden="true"><path stroke="currentColor" d="M20 37 C 9 29, 3 22, 3.5 14 C 4 7, 10 4, 14.5 5 C 17.5 5.7, 19.2 7.6, 20 10" fill="none" stroke-width="2.6" stroke-linecap="round"/><path d="M20 10 C 21.5 5.5, 26 3.6, 30 4.6 C 35 5.8, 37.5 10.5, 36 15.5 C 34.5 20.5, 27 22.5, 23.5 26 C 21.2 28.3, 20.4 31, 20.2 33.5" fill="none" stroke="#ff6a3d" stroke-width="5.5" stroke-linecap="round"/><circle cx="20" cy="43.5" r="3.4" fill="#ff6a3d"/></svg>Who Would Love</a>
  <nav><a href="/#how">How it works</a><a href="/about">About</a><a href="/#start">Try it</a></nav>
</div>
<h1>Sample reports</h1>
<p class="intro">Finished reports for real products, exactly as their makers would get them. Each one shows who would love the product, what else those people love according to Qloo's taste graph, and where to reach them.</p>
<div class="grid" id="grid"></div>
<p class="state" id="state">Loading reports…</p>
</div>
<script>
const grid = document.getElementById('grid'), state = document.getElementById('state');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
fetch('/api/samples').then((r) => r.json()).then((list) => {
  if (!list.length) { state.textContent = 'No sample reports yet.'; return; }
  state.remove();
  for (const r of list) {
    const card = el('a', 'card'); card.href = '/r/' + encodeURIComponent(r.id);
    const head = el('div', 'head');
    if (r.icon) { const img = el('img', 'icon'); img.src = r.icon; img.alt = ''; img.loading = 'lazy'; head.append(img); }
    else head.append(el('div', 'icon mono', (r.name || '?').trim().charAt(0).toUpperCase()));
    const t = el('div'); t.append(el('h2', null, r.name), el('div', 'host', r.host)); head.append(t);
    card.append(head, el('p', 'summary', r.summary));
    if (r.audiences.length) {
      card.append(el('div', 'label', r.audiences.length + ' audiences'));
      const chips = el('div', 'chips'); for (const a of r.audiences) chips.append(el('span', 'chip', a)); card.append(chips);
    }
    const foot = el('div', 'foot'), meta = el('div');
    if (r.agent) meta.append(el('span', 'badge', 'Agent-read Qloo'));
    meta.append(el('span', 'date', r.date));
    foot.append(meta, el('span', 'go', 'Read report →'));
    card.append(foot); grid.append(card);
  }
}).catch(() => { state.textContent = 'We could not load the reports. Please try again later.'; });
</script>
</body>
</html>
